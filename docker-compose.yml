services:
  db:
    image: postgres:16-alpine
    container_name: tradingbot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradingbot_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: tradingbot_api
    env_file:
      - .env
    environment:
      ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trading}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MODEL_SAVE_PATH: /app/models/xgboost_model.json
      MODEL_METADATA_PATH: /app/models/xgboost_model_metadata.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - models_data:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - trading_network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: tradingbot_scheduler
    env_file:
      - .env
    environment:
      ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trading}
      MODEL_SAVE_PATH: /app/models/xgboost_model.json
      MODEL_METADATA_PATH: /app/models/xgboost_model_metadata.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_INTERVAL_SECONDS: ${BOT_INTERVAL_SECONDS:-60}
    volumes:
      - ./logs:/app/logs
      - models_data:/app/models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped
    profiles:
      - scheduler

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-worker
    container_name: tradingbot_celery_worker
    env_file:
      - .env
    environment:
      ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trading}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MODEL_SAVE_PATH: /app/models/xgboost_model.json
      MODEL_METADATA_PATH: /app/models/xgboost_model_metadata.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - models_data:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped
    profiles:
      - celery

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-beat
    container_name: tradingbot_celery_beat
    env_file:
      - .env
    environment:
      ENV: docker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BOT_INTERVAL_SECONDS: ${BOT_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - trading_network
    restart: unless-stopped
    profiles:
      - celery

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: tradingbot_streamlit
    env_file:
      - .env
    environment:
      ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trading}
      MODEL_SAVE_PATH: /app/models/xgboost_model.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./logs:/app/logs
      - models_data:/app/models
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped
    profiles:
      - dashboard

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradingbot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped
    profiles:
      - dashboard

volumes:
  postgres_data:
  redis_data:
  models_data:

networks:
  trading_network:
    driver: bridge
