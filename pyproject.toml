[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot-1"
version = "0.0.1-beta"
description = "A modular crypto trading bot with FastAPI backend, PostgreSQL model registry, ML pipeline, and notifier integration."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ovie", email = "oviemsaniyo30@gmail.com" }]
license = "MIT"
keywords = ["crypto", "trading", "bot", "xgboost", "machine-learning", "binance", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Web Framework ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.35.0",
    "python-multipart==0.0.20",
    # --- Database ---
    "sqlalchemy==2.0.46",
    "alembic==1.16.4",
    "psycopg2-binary==2.9.9",
    # --- Configuration & Validation ---
    "python-dotenv==1.1.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.13.1",
    # --- API & HTTP ---
    "requests==2.32.4",
    "httpx==0.28.1",
    # --- Trading & Exchange ---
    "python-binance==1.0.29",
    "ta==0.11.0",
    "backoff==2.2.1",
    # --- Notifications ---
    "python-telegram-bot==22.5",
    # --- Authentication & Security ---
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "python-jose==3.4.0",
    "email-validator==2.3.0",
    # --- Data Science & ML ---
    "pandas==2.3.0",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "xgboost==3.0.2",
    "imbalanced-learn==0.14.1",
    "joblib==1.5.1",
    # --- Visualization & Dashboard ---
    "matplotlib==3.10.8",
    "plotly==6.1.2",
    "streamlit==1.55.0",
    # --- ML Experiment Tracking ---
    "mlflow==3.10.0",
    # --- Templates ---
    "jinja2==3.1.6",
    # --- Async & Concurrency ---
    "aiohttp==3.13.3",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "langgraph==1.2.0",
]

[project.optional-dependencies]
dev = [
    # --- Linting & Formatting ---
    "ruff==0.15.6",
    "mypy==1.19.1",
    # --- Testing ---
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.0.0",
    "pytest-snapshot==0.9.0",
    "pytest-codspeed==4.3.0",
    "pytest-emoji==0.2.0",
    "pytest-xdist[psutil]==3.8.0",
    # --- Type Stubs ---
    "types-requests==2.32.4.20260107",
    "types-psycopg2==2.9.21.20260223",
    "types-python-jose==3.5.0.20250531",
    "types-passlib==1.7.7.20260211",
    "pandas-stubs==3.0.0.260204",
    "types-setuptools==82.0.0.20260210",
]

# ============================================================
# 🧹 RUFF - Fast Python Linter & Formatter
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 100
output-format = "grouped"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "migrations",
    "*.egg-info",
    ".env*",
]

[tool.ruff.lint]
select = ["A", "E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
# 🔍 MYPY - Static Type Checking
# ============================================================
[tool.mypy]
files = ["app", "tests"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
ignore_missing_imports = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "binance.*",
    "sqlalchemy.*",
    "pydantic.*",
    "streamlit.*",
    "sklearn.*",
    "plotly.*",
]
ignore_missing_imports = true

# ============================================================
# 🧪 PYTEST - Test Configuration
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "--tb=short --disable-warnings"

# ============================================================
# 📦 COVERAGE - Code Coverage Analysis
# ============================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
]
precision = 2
show_missing = true

[project.urls]
Homepage = "https://github.com/OVIE-web/MyTradingProject-crypto_trading_bot"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-dir]
"" = "app"
